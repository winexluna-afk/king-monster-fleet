<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Monster Fleet</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;700&display=swap');
:root {
  --bg:#080808; --surface:#101010; --surface2:#181818; --border:#252525;
  --gold:#f0c040; --red:#cc2222; --green:#2dbd6e; --orange:#e05a2b; --blue:#4a9eff;
  --text:#f0ede8; --muted:#5a5a5a;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif; --display:'Bebas Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}

/* ── LOGIN ── */
#login-screen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,rgba(204,34,34,0.18) 0%,transparent 55%),var(--bg);
  padding:20px;
}
#login-screen.hidden{display:none;}
.login-logo{height:110px;width:auto;margin-bottom:14px;filter:drop-shadow(0 4px 24px rgba(204,34,34,0.5));}
.login-title{font-family:"Cinzel",var(--display);font-size:34px;letter-spacing:3px;color:var(--gold);text-align:center;font-weight:700;}
.login-sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:2px;text-align:center;margin-bottom:36px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--red);border-radius:8px;padding:28px;width:100%;max-width:360px;}
.login-card h2{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:20px;}

/* PIN buttons */
.truck-select{display:flex;gap:10px;margin-bottom:20px;}
.truck-opt{flex:1;padding:12px 8px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;cursor:pointer;text-align:center;transition:all 0.15s;}
.truck-opt:hover{border-color:var(--gold);}
.truck-opt.selected{border-color:var(--gold);background:rgba(240,192,64,0.08);}
.truck-opt .to-icon{font-size:22px;margin-bottom:4px;}
.truck-opt .to-name{font-family:var(--display);font-size:16px;letter-spacing:1px;color:var(--gold);}
.truck-opt .to-sub{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;}

.pin-label{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.pin-display{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);transition:all 0.15s;}
.pin-dot.filled{background:var(--gold);border-color:var(--gold);}
.pin-dot.error{background:var(--red);border-color:var(--red);}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.pin-key{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:14px;font-family:var(--display);font-size:22px;letter-spacing:1px;color:var(--text);cursor:pointer;transition:all 0.1s;text-align:center;}
.pin-key:hover{background:var(--surface);border-color:var(--gold);color:var(--gold);}
.pin-key:active{transform:scale(0.95);}
.pin-key.del{font-size:16px;color:var(--muted);}
.pin-error{font-family:var(--mono);font-size:11px;color:var(--red);text-align:center;min-height:16px;margin-top:-8px;margin-bottom:8px;}

/* ── APP ── */
#app-screen{display:none;}
#app-screen.visible{display:block;}
header{background:linear-gradient(135deg,#0f0f0f 0%,#1a1008 100%);border-bottom:2px solid var(--red);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:66px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(204,34,34,0.25);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-logo{height:48px;width:auto;}
.header-info .main{font-family:"Cinzel",var(--display);font-size:14px;letter-spacing:1px;color:var(--gold);font-weight:700;white-space:nowrap;}
.header-info .sub{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
.header-right{display:flex;align-items:center;gap:10px;}
.user-badge{background:rgba(240,192,64,0.1);border:1px solid rgba(240,192,64,0.3);padding:4px 12px;border-radius:4px;font-family:var(--mono);font-size:11px;color:var(--gold);}
.week-badge{background:var(--surface2);border:1px solid var(--border);padding:4px 8px;border-radius:4px;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;display:flex;align-items:center;gap:6px;}
.week-nav-btn{background:none;border:none;color:var(--gold);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;opacity:1;transition:opacity 0.2s;}
.week-nav-btn:hover{opacity:0.7;}
.week-badge strong{color:var(--text);display:block;font-size:11px;}
.btn-logout{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:1px;transition:all 0.15s;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);padding:0 20px;overflow-x:auto;}
.tab{padding:12px 16px;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

main{padding:20px;max-width:1100px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:14px;}
.card-title{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px;}
.stat-label{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.stat-value{font-family:var(--display);font-size:26px;letter-spacing:1px;}
.stat-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;}
.c-gold{color:var(--gold)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-blue{color:var(--blue)}

.breakdown-bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:10px 0;display:flex;}
.bar-driver{background:var(--green)}.bar-company{background:var(--gold)}.bar-exp{background:var(--red)}
.breakdown-legend{display:flex;gap:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-family:var(--mono);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.fleet-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
@media(max-width:600px){.fleet-grid{grid-template-columns:1fr;}}
.fleet-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;}
.fc-name{font-family:var(--display);font-size:18px;letter-spacing:1px;color:var(--gold);}
.fc-driver{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:10px;}
.fc-gross{font-family:var(--display);font-size:28px;color:var(--green);}
.fc-sub{font-family:var(--mono);font-size:10px;color:var(--muted);}

.truck-tabs{display:flex;gap:8px;margin-bottom:16px;}
.truck-tab{padding:8px 16px;border:1px solid var(--border);background:var(--surface2);border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);transition:all 0.15s;}
.truck-tab:hover{border-color:var(--gold);color:var(--gold);}
.truck-tab.active{border-color:var(--gold);color:var(--gold);background:rgba(240,192,64,0.08);}

.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.upload-grid{grid-template-columns:1fr;}}
.upload-box{border:2px dashed var(--border);border-radius:6px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;}
.upload-box:hover{border-color:var(--gold);background:rgba(240,192,64,0.03);}
.upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-icon{font-size:26px;margin-bottom:8px;}
.upload-box h3{font-family:var(--display);font-size:17px;letter-spacing:1px;color:var(--gold);margin-bottom:4px;}
.upload-box p{font-size:11px;color:var(--muted);}

.ai-status{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:11px 14px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;min-height:44px;}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.ai-dot.thinking{background:var(--gold);animation:pulse 1s infinite;}
.ai-dot.done{background:var(--green);}
.ai-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.entries-table{width:100%;border-collapse:collapse;font-size:12px;}
.entries-table th{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);}
.entries-table td{padding:9px 10px;border-bottom:1px solid #181818;vertical-align:middle;}
.entries-table tr:hover td{background:rgba(255,255,255,0.02);}
.entries-table tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-family:var(--mono);font-size:9px;letter-spacing:0.5px;}
.tag-rate{background:rgba(45,189,110,0.15);color:var(--green);border:1px solid rgba(45,189,110,0.3);}
.tag-diesel{background:rgba(240,192,64,0.15);color:var(--gold);border:1px solid rgba(240,192,64,0.3);}
.tag-toll{background:rgba(224,90,43,0.15);color:var(--orange);border:1px solid rgba(224,90,43,0.3);}
.tag-other{background:rgba(150,150,150,0.12);color:#999;border:1px solid rgba(150,150,150,0.25);}
.tag-wl{background:rgba(74,158,255,0.12);color:var(--blue);border:1px solid rgba(74,158,255,0.25);}
.tag-lumper{background:rgba(224,90,43,0.15);color:var(--orange);border:1px solid rgba(224,90,43,0.3);}
.tag-lumper-b{background:rgba(100,200,180,0.12);color:#4dc9a8;border:1px solid rgba(100,200,180,0.3);}
.amount-green{color:var(--green);font-family:var(--mono);font-weight:600;}
.amount-red{color:var(--red);font-family:var(--mono);}
.btn-delete{background:none;border:1px solid #252525;color:#444;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:10px;font-family:var(--mono);transition:all 0.15s;}
.btn-delete:hover{border-color:var(--red);color:var(--red);}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:500px){.form-grid{grid-template-columns:1fr;}}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
.form-group input,.form-group select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:4px;font-family:var(--mono);font-size:12px;transition:border-color 0.15s;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--gold);}
.form-group select option{background:var(--surface2);}
.btn{padding:9px 18px;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;border:none;transition:all 0.15s;}
.btn-primary{background:var(--gold);color:#000;font-weight:700;}
.btn-primary:hover{background:#ffd060;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{border-color:var(--text);color:var(--text);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-family:var(--mono);font-size:12px;}
.empty-icon{font-size:30px;margin-bottom:10px;opacity:0.4;}

.invoice-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.invoice-header{background:var(--surface2);border-bottom:3px solid var(--red);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;}
.invoice-logo{height:55px;width:auto;}
.invoice-title-text{font-family:var(--display);font-size:34px;letter-spacing:3px;color:var(--gold);}
.invoice-meta{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.8;margin-top:3px;}
.invoice-body{padding:22px 24px;}
.invoice-section{margin-bottom:18px;}
.invoice-section-title{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.invoice-row{display:flex;justify-content:space-between;padding:7px 0;font-size:12px;border-bottom:1px solid #181818;}
.invoice-row:last-child{border-bottom:none;}
.invoice-row span:last-child{font-family:var(--mono);}
.invoice-total{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:14px 18px;margin-top:12px;}
.invoice-total-row{display:flex;justify-content:space-between;padding:4px 0;font-family:var(--mono);font-size:11px;}
.invoice-total-row.big{font-size:18px;color:var(--green);border-top:1px solid var(--border);margin-top:8px;padding-top:10px;}
.invoice-total-row.big span:first-child{font-family:var(--display);font-size:20px;letter-spacing:1px;}
.invoice-footer{padding:12px 24px;border-top:1px solid var(--border);font-family:var(--mono);font-size:9px;color:var(--muted);display:flex;justify-content:space-between;}

.sync-pill{font-family:var(--mono);font-size:9px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.sync-dot.off{background:var(--muted);}


/* ── DOCUMENTS ── */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.doc-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:14px;transition:border-color 0.2s;}
.doc-card.ok{border-left:3px solid var(--green);}
.doc-card.warn{border-left:3px solid var(--gold);}
.doc-card.expired{border-left:3px solid var(--red);}
.doc-card.empty{border-left:3px solid var(--border);}
.dc-icon{font-size:20px;margin-bottom:6px;}
.dc-name{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.dc-status{font-family:var(--mono);font-size:11px;margin-bottom:6px;}
.dc-exp{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px;}
.doc-img-thumb{width:100%;height:65px;object-fit:cover;border-radius:4px;margin-top:6px;cursor:pointer;border:1px solid var(--border);}
.doc-btn{display:inline-flex;align-items:center;margin-top:6px;margin-right:4px;padding:4px 9px;border:1px solid var(--border);border-radius:3px;font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all 0.15s;position:relative;background:none;}
.doc-btn:hover{border-color:var(--gold);color:var(--gold);}
.doc-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.preview-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9998;align-items:center;justify-content:center;padding:20px;pointer-events:none;}
.preview-modal.open{display:flex;pointer-events:all;}
.preview-modal-box{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:8px;padding:24px;width:100%;max-width:420px;}
.preview-modal-box h3{font-family:var(--display);font-size:22px;letter-spacing:1px;color:var(--gold);margin-bottom:4px;}
.preview-modal-box .pm-file{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:16px;}
.pm-row{margin-bottom:12px;}
.pm-row label{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px;}
.pm-row input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:4px;font-family:var(--mono);font-size:13px;width:100%;}
.pm-row input:focus{outline:none;border-color:var(--gold);}
.pm-amount{font-family:var(--display);font-size:36px;color:var(--green);margin-bottom:16px;}
.doc-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;align-items:center;justify-content:center;padding:20px;pointer-events:none;}
.doc-modal.open{display:flex;pointer-events:all;}
.doc-modal-inner{position:relative;}
.doc-modal img{max-width:90vw;max-height:85vh;border-radius:6px;border:2px solid var(--border);}
.doc-modal-close{position:absolute;top:-36px;right:0;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:10px;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <img class="login-logo" id="loginLogo" src="" alt="King Monster LLC">
  <div class="login-title">King Monster</div>
  <div class="login-sub">Fleet Truck Ledger · White Lane LLC</div>

  <div class="login-card">
    <h2>¿Cuál es tu truck?</h2>
    <div class="truck-select">
      <div class="truck-opt" id="opt-admin" onclick="selectTruck('admin')">
        <div class="to-icon">👑</div>
        <div class="to-name">Admin</div>
        <div class="to-sub">King Monster</div>
      </div>
      <div class="truck-opt" id="opt-truck1" onclick="selectTruck('truck1')">
        <div class="to-icon">🚛</div>
        <div class="to-name">Truck #1</div>
        <div class="to-sub">Luis Gómez</div>
      </div>
      <div class="truck-opt" id="opt-truck2" onclick="selectTruck('truck2')">
        <div class="to-icon">🚛</div>
        <div class="to-name">Truck #2</div>
        <div class="to-sub">Willys Luna</div>
      </div>
    </div>

    <div class="pin-label">Ingresa tu PIN</div>
    <div class="pin-display" id="pinDisplay">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-error" id="pinError"></div>

    <div class="pin-keypad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key del" onclick="pinKey('clear')">CLR</button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key del" onclick="pinKey('del')">⌫</button>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app-screen">
  <header>
    <div class="header-left">
      <img class="header-logo" id="headerLogo" src="" alt="">
      <div class="header-info">
        <div class="main">King Monster</div>
        <div class="sub">Fleet Admin · White Lane LLC</div>
      </div>
    </div>
    <div class="header-right">
      <div class="user-badge" id="userBadge">—</div>
      <div class="week-badge">
        <button class="week-nav-btn" onclick="changeWeek(-1)" title="Semana anterior">‹</button>

// ══ WEEK ═════════════════════════════════════
function getWeekKey(offset) {
  offset = offset !== undefined ? offset : weekOffset;
  const n=new Date();
  n.setDate(n.getDate() + (offset * 7));
  const day=n.getDay(), m=new Date(n);
  m.setDate(n.getDate()-(day===0?6:day-1));
  return m.toISOString().slice(0,10);
}

function getWeekRange(offset) {
  offset = offset !== undefined ? offset : weekOffset;
  const n=new Date();
  n.setDate(n.getDate() + (offset * 7));
  const day=n.getDay(), m=new Date(n);
  m.setDate(n.getDate()-(day===0?6:day-1));
  const s=new Date(m); s.setDate(m.getDate()+6);
  const f=d=>d.toLocaleDateString('es-US',{month:'short',day:'numeric'});
  return {start:m, end:s, label: f(m)+' – '+f(s), weekNum: getWeekNumber(n)};
}

function changeWeek(delta) {
  weekOffset += delta;
  updateWeekHeader();
  renderActivePanel();
}
function getWeekNumber(d) {
  d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  return Math.ceil((((d-new Date(Date.UTC(d.getUTCFullYear(),0,1)))/86400000)+1)/7);
}
function updateWeekHeader() {
  const wr = getWeekRange();
  document.getElementById('weekDates').textContent = wr.label;
  document.getElementById('weekLabel').textContent = 'Semana '+wr.weekNum;
  // Show/hide forward arrow
  const fwd = document.getElementById('weekFwd');
  if(fwd) fwd.style.opacity = weekOffset >= 0 ? '0.3' : '1';
}

// ══ CALC ══════════════════════════════════════
function calcStats(truck) {
  const wk=getWeekKey();
  const wkE=(entries[truck]||[]).filter(e=>e.weekKey===wk);
  const gross=wkE.filter(e=>e.type==='rate').reduce((s,e)=>s+e.amount,0);
  const driver30=gross*0.30, company12=gross*0.12;
  const diesel=wkE.filter(e=>e.type==='diesel').reduce((s,e)=>s+e.amount,0);
  const toll=wkE.filter(e=>e.type==='toll').reduce((s,e)=>s+e.amount,0);
  const other=wkE.filter(e=>e.type==='other').reduce((s,e)=>s+e.amount,0);
  const lumperDriver=(wkE||[]).filter(e=>e.type==='lumper_driver').reduce((s,e)=>s+e.amount,0);
  const lumperBroker=(wkE||[]).filter(e=>e.type==='lumper_broker').reduce((s,e)=>s+e.amount,0);
  const wlFees=['eld','trailer','yarda','seguro'].reduce((s,t)=>s+wkE.filter(e=>e.type===t).reduce((ss,e)=>ss+e.amount,0),0);
  // Gastos reales del truck (lumper_driver se incluye, WL lo reembolsa al driver pero es gasto real)
  const driverExp=diesel+toll+other+wlFees+lumperDriver;
  const exp=driverExp;
  // Neto Empresa = Gross - 30% driver - 12% WL - gastos del truck
  const net=gross-driver30-company12-driverExp;
  return{gross,driver30,company12,diesel,toll,other,wlFees,lumperDriver,lumperBroker,driverExp,totalExpenses:exp,net,entries:wkE};
}
const fmt=n=>'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

  bindEvents();
}

// ══ DATA OPS ══════════════════════════════════
function addEntry(truck, entry) {
  entry.truck=truck; entry.weekKey=getWeekKey();
  if(firebaseReady) {
    entry.createdAt=firebase.firestore.FieldValue.serverTimestamp();
    db.collection('entries').add(entry).catch(()=>{
      entry.id=Date.now().toString(); entry.createdAt={seconds:Date.now()/1000};
      entries[truck].unshift(entry); renderActivePanel();
    });
  } else {
    entry.id=Date.now().toString(); entry.createdAt={seconds:Date.now()/1000};
    if(!entries[truck]) entries[truck]=[];
    entries[truck].unshift(entry); renderActivePanel();
  }
}

function deleteEntry(id, truck) {
  if(firebaseReady) {
    db.collection('entries').doc(id).delete().catch(()=>{
      entries[truck]=(entries[truck]||[]).filter(e=>e.id!==id); renderActivePanel();
    });
  } else {
    entries[truck]=(entries[truck]||[]).filter(e=>e.id!==id); renderActivePanel();
  }
}

function clearTruck(truck) {
  if(!confirm(`¿Borrar todas las entradas de ${truck==='truck1'?'Truck #1':'Truck #2'} esta semana?`)) return;
  const wk=getWeekKey();
  const toDelete=(entries[truck]||[]).filter(e=>e.weekKey===wk);
  if(firebaseReady){
    const batch=db.batch();
    toDelete.forEach(e=>batch.delete(db.collection('entries').doc(e.id)));
    batch.commit();
  } else {
    entries[truck]=(entries[truck]||[]).filter(e=>e.weekKey!==wk); renderActivePanel();
  }
}

function addManual() {
  const type=document.getElementById('manType').value;
  const amount=parseFloat(document.getElementById('manAmount').value);
  const desc=document.getElementById('manDesc').value.trim()||typeLabel(type);
  const date=document.getElementById('manDate').value||new Date().toISOString().slice(0,10);
  const milesEl=document.getElementById('manMiles');
  const miles=type==='rate'&&milesEl&&milesEl.value?parseFloat(milesEl.value)||null:null;
  if(!amount||isNaN(amount)||amount<=0){alert('Ingresa un monto válido');return;}
  addEntry(activeTruckTab,{type,amount,desc,date,miles});
  document.getElementById('manAmount').value='';
  document.getElementById('manDesc').value='';
  setStatus('done',`✅ Agregado a ${activeTruckTab==='truck1'?'Truck #1':'Truck #2'}: ${typeLabel(type)} — ${fmt(amount)}`);
}

// ══ AI UPLOAD ════════════════════════════════
function setStatus(state,msg){
  const d=document.getElementById('aiDot'),t=document.getElementById('aiText');
  if(d) d.className='ai-dot '+state;
  if(t) t.textContent=msg;
}
async function handleUpload(ev,docType) {
  const files=Array.from(ev.target.files); if(!files.length)return;
  for(const file of files){
    setStatus('thinking',`Leyendo "${file.name}"...`);
    try{
      const b64=await fileToBase64(file);
      const res=await callClaude(b64,file.type,docType);
      if(res){ showPreviewModal(res, file.name); }
      else setStatus('error',`No se pudo extraer de "${file.name}". Agrégalo manualmente.`);
    }catch(err){setStatus('error',`Error: ${err.message}`);}
  }
  ev.target.value='';
}

let pendingEntry = null;

function showPreviewModal(res, filename) {
  pendingEntry = res;
  const isRate = res.type === 'rate';
  const modal = document.getElementById('previewModal');
  document.getElementById('pmFilename').textContent = filename;
  document.getElementById('pmType').textContent = typeLabel(res.type);
  document.getElementById('pmAmount').textContent = fmt(res.amount);
  document.getElementById('pmDesc').value = res.desc || '';
  document.getElementById('pmDate').value = res.date || new Date().toISOString().slice(0,10);
  document.getElementById('pmMilesRow').style.display = isRate ? 'block' : 'none';
  document.getElementById('pmMiles').value = res.miles || '';
  modal.classList.add('open');
  setStatus('done', '✅ Extraído — revisa y confirma antes de guardar');
}

function confirmPreview() {
  if(!pendingEntry) return;
  pendingEntry.desc = document.getElementById('pmDesc').value || typeLabel(pendingEntry.type);
  pendingEntry.date = document.getElementById('pmDate').value;
  if(pendingEntry.type === 'rate') {
    const m = parseFloat(document.getElementById('pmMiles').value);
    pendingEntry.miles = m || null;
  }
  addEntry(activeTruckTab, pendingEntry);
  setStatus('done', `✅ Guardado: ${typeLabel(pendingEntry.type)} — ${fmt(pendingEntry.amount)}`);
  pendingEntry = null;
  document.getElementById('previewModal').classList.remove('open');
}

function cancelPreview() {
  pendingEntry = null;
  document.getElementById('previewModal').classList.remove('open');
  setStatus('error', 'Cancelado — puedes agregar manualmente si quieres');
}
function fileToBase64(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.onerror=()=>j(new Error('Error'));rd.readAsDataURL(f);});}
async function callClaude(b64,mt,docType){
  if(!ANTHROPIC_KEY || ANTHROPIC_KEY===''){
    setStatus('error','⚠️ Agrega tu API key de Anthropic en el archivo HTML');
    return null;
  }
  const p=docType==='rate'
    ?'You are reading a trucking rate confirmation. Extract: 1) Total carrier pay in USD (look for "Total Carrier Pay", "Carrier Freight Pay", or similar). 2) Route as "City ST - City ST" format (short, just city and state abbreviation, example: "Woodbridge NJ - Hanover MD"). 3) Date of pickup. 4) Total miles (look for "Miles:" field). Respond ONLY with this exact JSON format: {"type":"rate","amount":1300.00,"desc":"City ST - City ST","date":"2026-03-10","miles":178}. Use null for miles only if truly not found. If no dollar amount: {"error":"not found"}'
    :'You are reading an expense receipt for a truck driver. Extract: 1) Total amount paid. 2) Type: use "diesel" for fuel/gas, "toll" for tolls/turnpike, "lumper_driver" for lumper fees paid by driver, "other" for anything else. 3) Merchant or location name (short). 4) Date. Respond ONLY with this JSON: {"type":"diesel","amount":150.00,"desc":"Merchant Name","date":"2026-03-10"}. If no amount: {"error":"not found"}';
  const blk=mt==='application/pdf'?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}:{type:'image',source:{type:'base64',media_type:mt,data:b64}};
  try {
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': ANTHROPIC_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:300,messages:[{role:'user',content:[blk,{type:'text',text:p}]}]})
    });
    const d=await r.json();
    if(d.error){setStatus('error','API Error: '+d.error.message);return null;}
    const o=JSON.parse((d.content?.[0]?.text||'').replace(/```json|```/g,'').trim());
    return o.error||!o.amount?null:o;
  } catch(e){
    setStatus('error','Error: '+e.message);
    return null;
  }
}

    <div class="pm-row" id="pmMilesRow">
      <label>Millas</label>
      <input type="number" id="pmMiles" placeholder="ej. 850">
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-primary" style="flex:1" onclick="confirmPreview()">&#x2714; Confirmar y Guardar</button>
      <button class="btn btn-ghost" onclick="cancelPreview()">&#x2715; Cancelar</button>
    </div>
  </div>
</div>
</body></html>`);
  w.document.close();
}

// ══ MILES PANEL ══════════════════════════════
function renderMilesPanel() {
  const wk=getWeekKey();
  const allRates=[...(entries.truck1||[]),...(entries.truck2||[])].filter(e=>e.weekKey===wk&&e.type==='rate').sort((a,b)=>(b.miles?b.amount/b.miles:0)-(a.miles?a.amount/a.miles:0));
  const t1R=(entries.truck1||[]).filter(e=>e.weekKey===wk&&e.type==='rate');
  const t2R=(entries.truck2||[]).filter(e=>e.weekKey===wk&&e.type==='rate');
  const t1Mi=t1R.reduce((s,e)=>s+(e.miles||0),0), t2Mi=t2R.reduce((s,e)=>s+(e.miles||0),0);
  const t1G=t1R.reduce((s,e)=>s+e.amount,0), t2G=t2R.reduce((s,e)=>s+e.amount,0);
  const t1rpm=t1Mi?t1G/t1Mi:0, t2rpm=t2Mi?t2G/t2Mi:0;
  const totMi=t1Mi+t2Mi, totG=t1G+t2G, totRpm=totMi?totG/totMi:0;
  function rc(r){return r>=2.5?'var(--green)':r>=2.0?'var(--gold)':'var(--red)';}
  const rLabel=(r)=>r>=2.5?'🟢 Excellent':r>=2.0?'🟡 Regular':'🔴 Low';
  return `
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">Fleet Miles</div><div class="stat-value c-gold">${totMi.toLocaleString()}</div><div class="stat-sub">This week</div></div>
      <div class="stat-box"><div class="stat-label">Fleet $/Mile</div><div class="stat-value" style="color:${rc(totRpm)}">${totRpm?'$'+totRpm.toFixed(2):'—'}</div><div class="stat-sub">Fleet avg</div></div>
      <div class="stat-box"><div class="stat-label">Truck #1 $/mi</div><div class="stat-value" style="color:${rc(t1rpm)}">${t1rpm?'$'+t1rpm.toFixed(2):'—'}</div><div class="stat-sub">${t1Mi.toLocaleString()} mi</div></div>
      <div class="stat-box"><div class="stat-label">Truck #2 $/mi</div><div class="stat-value" style="color:${rc(t2rpm)}">${t2rpm?'$'+t2rpm.toFixed(2):'—'}</div><div class="stat-sub">${t2Mi.toLocaleString()} mi</div></div>
    </div>
    <div class="card">
      <div class="card-title">Reefer Rate Guide</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px">
        <span style="color:var(--green)">🟢 $2.50+/mi — Excellent</span>
        <span style="color:var(--gold)">🟡 $2.00–$2.49/mi — Regular</span>
        <span style="color:var(--red)">🔴 Below $2.00/mi — Low</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Trip Ranking — best $/mile first</div>
      ${allRates.length===0?'<div class="empty-state"><div class="empty-icon">📍</div>No trips with miles this week.<br>Miles are extracted from rate confirmations automatically.</div>':
        '<table class="entries-table"><thead><tr><th>Rank</th><th>Truck</th><th>Date</th><th>Route</th><th>Miles</th><th>Gross</th><th>$/Mile</th></tr></thead><tbody>'
        +allRates.map((e,i)=>{const rpm=e.miles?e.amount/e.miles:null;const c=rpm?rc(rpm):'var(--muted)';
          return '<tr>'
            +'<td style="font-family:var(--mono);font-size:12px;color:'+(i===0?'var(--gold)':'var(--muted)')+'">'+( i===0?'🏆':'#'+(i+1))+'</td>'
            +'<td style="font-family:var(--mono);font-size:10px;color:var(--gold)">'+(e.truck==='truck1'?'Reinmy':'Willys')+'</td>'
            +'<td style="font-family:var(--mono);font-size:10px;color:var(--muted)">'+e.date+'</td>'
            +'<td style="font-size:12px">'+(e.desc||'—')+'</td>'
            +'<td style="font-family:var(--mono);font-size:11px">'+(e.miles?e.miles.toLocaleString():'<span style=color:var(--muted)>no data</span>')+'</td>'
            +'<td class="amount-green">'+fmt(e.amount)+'</td>'
            +'<td style="font-family:var(--mono);font-size:13px;font-weight:700;color:'+c+'">'+( rpm?'$'+rpm.toFixed(2):'—')+'</td>'
            +'</tr>';}).join('')
        +'</tbody></table>'}
    </div>`;
}

// ══ DOCUMENTS PANEL ══════════════════════════

const DOC_TYPES = [
  { key:'registration', icon:'📋', label:'Registration' },
  { key:'smog',         icon:'💨', label:'Smog Inspection' },
  { key:'insurance',    icon:'🛡️', label:'Insurance' },
  { key:'ifta',         icon:'⛽', label:'IFTA' },
  { key:'dot_inspect',  icon:'🔍', label:'DOT Inspection' },
  { key:'twic',         icon:'🪪', label:'TWIC Card' },
  { key:'license',      icon:'🚗', label:'Drivers License' },
  { key:'dot_medical',  icon:'🩺', label:'DOT Medical Exam' },
];

let docsCache = { truck1:{}, truck2:{} };

function subscribeDocData() {
  if(!firebaseReady) return;
  ['truck1','truck2'].forEach(function(truck) {
    db.collection('documents').where('truck','==',truck).onSnapshot(function(snap) {
      snap.docs.forEach(function(d){ docsCache[truck][d.data().docKey] = d.data(); });
      var a = document.querySelector('.tab.active');
      if(a && a.getAttribute('onclick') && a.getAttribute('onclick').indexOf("'docs'")>=0){
        renderPanel('docs'); bindDocEvents();
      }
    }, function(e){ console.log('docs err',e); });
  });
}

function saveDoc(truck, docKey, data) {
  if(firebaseReady) {
    db.collection('documents').doc(truck+'_'+docKey)
      .set(Object.assign({truck:truck,docKey:docKey},data,{updatedAt:firebase.firestore.FieldValue.serverTimestamp()}))
      .catch(function(){ localStorage.setItem('doc_'+truck+'_'+docKey, JSON.stringify(data)); });
  } else {
    localStorage.setItem('doc_'+truck+'_'+docKey, JSON.stringify(data));
  }
}

function getDoc(truck, docKey) {
  if(docsCache[truck] && docsCache[truck][docKey] && docsCache[truck][docKey].image) return docsCache[truck][docKey];
  var raw = localStorage.getItem('doc_'+truck+'_'+docKey);
  return raw ? JSON.parse(raw) : null;
}

function docStatus(doc) {
  if(!doc||!doc.image) return {cls:'empty', label:'Not uploaded', color:'var(--muted)'};
  if(!doc.expiry)      return {cls:'ok',    label:'Uploaded — no expiry set', color:'var(--green)'};
  var diff = Math.ceil((new Date(doc.expiry) - new Date()) / 86400000);
  if(diff < 0)  return {cls:'expired', label:'EXPIRED '+Math.abs(diff)+'d ago', color:'var(--red)'};
  if(diff < 30) return {cls:'warn',    label:'Expires in '+diff+' days', color:'var(--gold)'};
  return {cls:'ok', label:'Valid · exp '+doc.expiry, color:'var(--green)'};
}

function renderDocsPanel() {
  var truck = docsViewTruck;
  var driverName = truck==='truck1'?'Luis Gómez':'Willys Luna';
  var isAdm = isAdmin();
  var out = '';
  
  // Admin puede cambiar entre trucks, drivers no
  if (isAdm) {
    var t1active = truck==='truck1'?'active':'';
    var t2active = truck==='truck2'?'active':'';
    out += '<div class="truck-tabs" style="margin-bottom:16px">';
    out += '<div class="truck-tab '+t1active+'" onclick="setDocTruck(&quot;truck1&quot;)">&#x1F69B; Truck #1 &mdash; Luis Gómez</div>';
    out += '<div class="truck-tab '+t2active+'" onclick="setDocTruck(&quot;truck2&quot;)">&#x1F69B; Truck #2 &mdash; Willys Luna</div>';
    out += '</div>';
  }
  
  out += '<div class="card">';
  out += '<div class="card-title">&#x1F4C1; Truck Documents &mdash; '+driverName+'</div>';
  out += '<div class="doc-grid">';
  
  DOC_TYPES.forEach(function(dt) {
    var doc = getDoc(truck, dt.key);
    var st = docStatus(doc);
    out += '<div class="doc-card '+st.cls+'">';
    out += '<div class="dc-icon">'+dt.icon+'</div>';
    out += '<div class="dc-name">'+dt.label+'</div>';
    out += '<div class="dc-status" style="color:'+st.color+'">'+st.label+'</div>';
    if(doc && doc.expiry) out += '<div class="dc-exp">Exp: '+doc.expiry+'</div>';
    if(doc && doc.image) out += '<img class="doc-img-thumb" src="'+doc.image+'" alt="doc" onclick="openDocModal(this.src)">';
    out += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:8px">';
    out += '<button class="doc-btn">'+(doc&&doc.image?'&#x1F504; Replace':'&#x1F4F7; Upload')+'<input type="file" accept="image/*" data-truck="'+truck+'" data-doc="'+dt.key+'"></button>';
    out += '<button class="doc-btn" onclick="setDocExpiry(&quot;'+truck+'&quot;,&quot;'+dt.key+'&quot;)">&#x1F4C5; Date</button>';
    if(doc && doc.image) out += '<button class="doc-btn" style="color:var(--red);border-color:var(--red)" onclick="deleteDoc(&quot;'+truck+'&quot;,&quot;'+dt.key+'&quot;)">&#x1F5D1;</button>';
    out += '</div></div>';
  });
  
  out += '</div></div>';
  return out;
}

function setDocTruck(t){ docsViewTruck=t; renderPanel('docs'); bindDocEvents(); }

function bindDocEvents() {
  document.querySelectorAll('.doc-btn input[type=file]').forEach(function(inp) {
    inp.addEventListener('change', function(ev) {
      var truck = ev.target.dataset.truck;
      var docKey = ev.target.dataset.doc;
      var file = ev.target.files[0];
      if(!file) return;
      var rd = new FileReader();
      rd.onload = function(e) {
        var data = getDoc(truck,docKey) || {};
        data.image = e.target.result;
        saveDoc(truck, docKey, data);
        if(!docsCache[truck]) docsCache[truck]={};
        docsCache[truck][docKey] = data;
        renderPanel('docs'); bindDocEvents();
      };
      rd.readAsDataURL(file);
    });
  });
}

function setDocExpiry(truck, docKey) {
  var cur = (getDoc(truck,docKey)||{}).expiry || '';
  var date = prompt('Expiry date (YYYY-MM-DD):', cur);
  if(date===null) return;
  var data = getDoc(truck,docKey) || {};
  data.expiry = date;
  saveDoc(truck, docKey, data);
  if(!docsCache[truck]) docsCache[truck]={};
  docsCache[truck][docKey] = data;
  renderPanel('docs'); bindDocEvents();
}

function deleteDoc(truck, docKey) {
  if(!confirm('Remove this document?')) return;
  saveDoc(truck, docKey, {});
  if(!docsCache[truck]) docsCache[truck]={};
  docsCache[truck][docKey] = {};
  renderPanel('docs'); bindDocEvents();
}

function openDocModal(src) {
  document.getElementById('docModalImg').src = src;
  document.getElementById('docModal').classList.add('open');
}



// ══ INLINE EDIT ══════════════════════════════
function editDesc(cell, id, truck) {
  const current = cell.textContent.trim();
  const input = document.createElement('input');
  input.type = 'text';
  input.value = current === '—' ? '' : current;
  input.style.cssText = 'background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:4px 8px;border-radius:3px;font-family:var(--mono);font-size:12px;width:100%;min-width:180px;outline:none;';
  cell.innerHTML = '';
  cell.appendChild(input);
  input.focus();
  input.select();

  function save() {
    const newVal = input.value.trim() || current;
    cell.textContent = newVal;
    updateEntryField(id, truck, 'desc', newVal);
  }
  input.addEventListener('blur', save);
  input.addEventListener('keydown', function(e) {
    if(e.key === 'Enter') { input.blur(); }
    if(e.key === 'Escape') { cell.textContent = current; }
  });
}


function editMiles(cell, id, truck) {
  const current = cell.textContent.trim();
  const currentVal = current === '+ mi' || current === '—' ? '' : current.replace(',','');
  const input = document.createElement('input');
  input.type = 'number';
  input.value = currentVal;
  input.placeholder = 'millas';
  input.style.cssText = 'background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:4px 6px;border-radius:3px;font-family:var(--mono);font-size:12px;width:80px;outline:none;';
  cell.innerHTML = '';
  cell.appendChild(input);
  input.focus();
  input.select();

  function save() {
    const newVal = parseFloat(input.value) || null;
    cell.textContent = newVal ? newVal.toLocaleString() : '+ mi';
    if(newVal) cell.style.color = 'var(--text)';
    updateEntryField(id, truck, 'miles', newVal);
    // Refresh $/mi in same row
    setTimeout(() => renderActivePanel(), 300);
  }
  input.addEventListener('blur', save);
  input.addEventListener('keydown', function(e) {
    if(e.key === 'Enter') input.blur();
    if(e.key === 'Escape') { cell.textContent = currentVal || '+ mi'; }
  });
}

function updateEntryField(id, truck, field, value) {
  // Update in local cache
  if(entries[truck]) {
    const entry = entries[truck].find(e => e.id === id);
    if(entry) entry[field] = value;
  }
  // Update in Firebase
  if(firebaseReady) {
    const update = {};
    update[field] = value;
    db.collection('entries').doc(id).update(update)
      .catch(e => console.log('Update error:', e));
  } else {
    // Update in localStorage fallback
    if(entries[truck]) {
      const entry = entries[truck].find(e => e.id === id);
      if(entry) entry[field] = value;
    }
  }
}

updateWeekHeader();
